server:
  port: 8081
spring:
  application:
    name: medroute
  datasource:
    url: jdbc:h2:mem:medroute;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
medroute:
  jwt:
    secret: ${MEDROUTE_JWT_SECRET:medroute-local-demo-secret-change-before-deploy}
    lifetime-seconds: 3600
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/medroute
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver